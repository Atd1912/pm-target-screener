services:
  - type: web
    name: pm-target-screener-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./pm_targets.db
      - key: ANTHROPIC_API_KEY
        sync: false
